<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="서울과 제주 날씨, 구글 검색, 오늘의 명언을 담은 나만의 시작 홈페이지">
  <title>나만의 시작 페이지</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="university" href="https://www.sdu.ac.kr/" target="_blank" rel="noopener noreferrer" aria-label="서울디지털대학교 홈페이지 새 창으로 열기">
      <span class="logo" aria-hidden="true">SDU</span>
      <span>서울디지털대학교<small>SEOUL DIGITAL UNIVERSITY</small></span>
    </a>
    <time id="today"></time>
  </header>

  <main>
    <!-- 수업의 최종 요청에 따라 화면에 별도 제목을 표시하지 않습니다. -->
    <section class="search-section" aria-label="구글 검색">
      <form id="search-form" action="https://www.google.com/search" method="get" role="search">
        <div class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <label class="sr-only" for="query">구글 검색어</label>
          <input id="query" name="q" type="search" placeholder="Google에서 검색해 보세요" required autocomplete="off" maxlength="2000">
          <button type="submit" class="search-submit" aria-label="검색"><span aria-hidden="true">→</span></button>
        </div>
        <button class="google-button" type="submit">Google 검색</button>
      </form>
    </section>

    <section class="weather-section" aria-labelledby="weather-heading">
      <div class="section-top"><h2 id="weather-heading">오늘의 날씨</h2><button id="refresh-weather" class="text-button" type="button">새로고침 ↻</button></div>
      <div class="weather-grid">
        <article class="weather-card" id="seoul" aria-labelledby="seoul-name">
          <div class="city-row"><h3 id="seoul-name">서울</h3><span class="weather-icon" aria-hidden="true">☁</span></div>
          <p class="temperature">--<span>°C</span></p>
          <p class="condition">날씨를 불러오는 중…</p>
          <p class="range">최저 --° · 최고 --°</p>
        </article>
        <article class="weather-card" id="jeju" aria-labelledby="jeju-name">
          <div class="city-row"><h3 id="jeju-name">제주</h3><span class="weather-icon" aria-hidden="true">☁</span></div>
          <p class="temperature">--<span>°C</span></p>
          <p class="condition">날씨를 불러오는 중…</p>
          <p class="range">최저 --° · 최고 --°</p>
        </article>
      </div>
      <p id="weather-status" class="status" role="status" aria-live="polite">서울과 제주 날씨를 확인하고 있어요.</p>
    </section>

    <section class="quote-section" aria-label="오늘의 명언">
      <span class="quote-label">오늘의 명언</span>
      <blockquote><p id="quote-text">천 리 길도 한 걸음부터.</p><footer id="quote-author">한국 속담</footer></blockquote>
      <button id="next-quote" class="text-button" type="button">다른 명언 보기 ↻</button>
    </section>
    <noscript><p class="status">날씨와 명언 변경 기능을 사용하려면 JavaScript를 켜 주세요. 검색과 학교 링크는 그대로 사용할 수 있습니다.</p></noscript>
  </main>
  <footer class="page-footer">날씨 제공 <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a><span>나만의 시작 페이지</span></footer>
</body>
</html>
